<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="151.87532mm"
   height="172.29471mm"
   viewBox="0 0 151.87532 172.29471"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path to show only the top part of the upper ellipse (above the overlap) -->
    <clipPath id="clip-top-only">
      <rect x="0" y="0" width="200" height="89.5"/>
    </clipPath>
    <!-- Clip path to show only the bottom part of the lower ellipse (below the overlap) -->
    <clipPath id="clip-bottom-only">
      <rect x="0" y="89.5" width="200" height="100"/>
    </clipPath>
  </defs>

  <g transform="translate(-26.368827,-60.356667)">
    <g transform="matrix(1.2357502,0,0,0.76612928,-21.268534,37.400198)">

      <!-- === FILL LAYERS (behind everything, use currentColor so parent can set color) === -->

      <!-- Upper ellipse fill -->
      <ellipse
         cx="100" cy="98.011444"
         rx="60" ry="66.596565"
         fill="currentColor"
         stroke="none" />

      <!-- Lower ellipse fill -->
      <ellipse
         cx="100" cy="186.80687"
         rx="60" ry="66.596565"
         fill="currentColor"
         stroke="none" />

      <!-- === BORDER LAYERS (on top, stroke only, no fill) === -->

      <!-- Upper ellipse border - full ellipse stroke -->
      <ellipse
         cx="100" cy="98.011444"
         rx="60" ry="66.596565"
         fill="none"
         stroke="#000000"
         stroke-width="2.9" />

      <!-- Lower ellipse border - full ellipse stroke -->
      <ellipse
         cx="100" cy="186.80687"
         rx="60" ry="66.596565"
         fill="none"
         stroke="#000000"
         stroke-width="2.9" />

    </g>
  </g>
</svg>
